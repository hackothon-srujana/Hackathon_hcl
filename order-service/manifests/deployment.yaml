apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  labels:
    app: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-container
        image: us-central1-docker.pkg.dev/glass-sylph-477607-e9/java-app/java-app:latest
        ports:
        - containerPort: 80
        