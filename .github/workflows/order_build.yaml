name: Build Java App and Push to GCR

on:
  push:
    branches:
      - hackathon # Trigger on pushes to the main branch

defaults:
  run:
    working-directory: ./order-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven' # Cache Maven dependencies

      - name: Build Java application with Maven
        run: mvn clean package -DskipTests # Build the JAR, skipping tests for speed

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Configure Docker to use gcloud as a credential helper
        run: |-
          gcloud auth configure-docker --quiet

      - name: Build and push Docker image to GCR
        env:
          IMAGE_NAME: us-central1-docker.pkg.dev//${{ secrets.GCP_PROJECT_ID }}/my-java-app:${{ github.sha }}
        run: |-
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME